<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brightpath</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #15171a; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e3e6ea; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
    input { padding: 6px 8px; }
    #error { color: #b42318; width: 100%; margin: 0; }
  </style>
</head>
<body>
  <h1>Brightpath</h1>
  <h2>Students</h2>
  <p id="count"></p>
  <input id="q" type="search" placeholder="Search by name" aria-label="Search students by name">
  <table>
    <thead><tr><th>Name</th><th>Email</th><th></th></tr></thead>
    <tbody id="students"><tr><td colspan="3">Loading…</td></tr></tbody>
  </table>
  <h2>Add student</h2>
  <form id="add-student">
    <input name="name" placeholder="Name" aria-label="Name" required>
    <input name="email" type="email" placeholder="Email" aria-label="Email" required>
    <button type="submit">Add student</button>
    <p id="error" role="alert" hidden></p>
  </form>
  <script>
    async function load(q = '') {
      const body = document.getElementById('students')
      try {
        const res = await fetch('/students' + (q ? '?q=' + encodeURIComponent(q) : ''))
        const { data } = await res.json()
        const { data: { count } } = await (await fetch('/students/count')).json()
        document.getElementById('count').textContent = `${count} ${count === 1 ? 'student' : 'students'}`
        body.replaceChildren(...(data.length ? data.map(row) : [empty()]))
      } catch {
        body.innerHTML = '<tr><td colspan="3">Could not load students.</td></tr>'
      }
    }
    function row(s) {
      const tr = document.createElement('tr')
      for (const v of [s.name, s.email]) {
        const td = document.createElement('td')
        td.textContent = v
        tr.append(td)
      }
      const td = document.createElement('td')
      const btn = document.createElement('button')
      btn.textContent = 'Remove'
      btn.addEventListener('click', async () => {
        if (!confirm('Remove ' + s.name + '?')) return
        const res = await fetch('/students/' + s.id, { method: 'DELETE' })
        if (res.ok || res.status === 404) load()
        else alert('Could not remove student.')
      })
      td.append(btn)
      tr.append(td)
      return tr
    }
    function empty() {
      const tr = document.createElement('tr')
      tr.innerHTML = '<td colspan="3">No students yet.</td>'
      return tr
    }
    document.getElementById('q').addEventListener('input', (e) => load(e.target.value))
    document.getElementById('add-student').addEventListener('submit', async (e) => {
      e.preventDefault()
      const form = e.target
      const error = document.getElementById('error')
      error.hidden = true
      try {
        const res = await fetch('/students', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ name: form.name.value, email: form.email.value }),
        })
        if (!res.ok) throw new Error()
        form.reset()
        await load()
      } catch {
        error.textContent = 'Could not add student. Check the name and email.'
        error.hidden = false
      }
    })
    load()
  </script>
</body>
</html>
