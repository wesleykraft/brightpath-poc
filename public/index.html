<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brightpath</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #15171a; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e3e6ea; }
  </style>
</head>
<body>
  <h1>Brightpath</h1>
  <h2>Students</h2>
  <table>
    <thead><tr><th>Name</th><th>Email</th><th></th></tr></thead>
    <tbody id="students"><tr><td colspan="3">Loading…</td></tr></tbody>
  </table>
  <script>
    async function load() {
      const body = document.getElementById('students')
      try {
        const res = await fetch('/students')
        const { data } = await res.json()
        body.replaceChildren(...(data.length ? data.map(row) : [empty()]))
      } catch {
        body.innerHTML = '<tr><td colspan="3">Could not load students.</td></tr>'
      }
    }
    function row(s) {
      const tr = document.createElement('tr')
      for (const v of [s.name, s.email]) {
        const td = document.createElement('td')
        td.textContent = v
        tr.append(td)
      }
      const action = document.createElement('td')
      const button = document.createElement('button')
      button.textContent = 'Remove'
      button.addEventListener('click', () => remove(s, button))
      action.append(button)
      tr.append(action)
      return tr
    }
    async function remove(s, button) {
      if (!confirm('Remove ' + s.name + '?')) return
      button.disabled = true
      try {
        const res = await fetch('/students/' + s.id, { method: 'DELETE' })
        if (!res.ok && res.status !== 404) throw new Error()
        await load()
      } catch {
        button.disabled = false
        alert('Could not remove student.')
      }
    }
    function empty() {
      const tr = document.createElement('tr')
      tr.innerHTML = '<td colspan="3">No students yet.</td>'
      return tr
    }
    load()
  </script>
</body>
</html>
